name: Deploy to Production

on:
  push:
    branches:
      - live

jobs:
  deploy:
    name: Deploy to readingadventure.adhdlearn.com
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 160.153.180.159 >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER_USER: corey
          SERVER_HOST: 160.153.180.159
          REMOTE_PATH: /var/www/readingadventure.adhdlearn.com
        run: |
          echo "🚀 Deploying Aurora's Reading Adventure to production..."

          # Deploy files using rsync
          rsync -avz --progress --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'node_modules/' \
            --exclude '.ai/' \
            --exclude 'android/' \
            --exclude 'deploy.sh' \
            --exclude 'https-server.py' \
            --exclude 'cert.pem' \
            --exclude 'key.pem' \
            --exclude '*.md' \
            --exclude 'README.md' \
            --exclude 'scripts/generate-*.js' \
            --exclude 'scripts/ICON-GENERATOR-README.md' \
            --exclude '.nojekyll' \
            --exclude '.env' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            . ${SERVER_USER}@${SERVER_HOST}:${REMOTE_PATH}/

          echo "✅ Files uploaded successfully"

      - name: Set file permissions
        env:
          SERVER_USER: corey
          SERVER_HOST: 160.153.180.159
          REMOTE_PATH: /var/www/readingadventure.adhdlearn.com
        run: |
          echo "🔒 Setting file permissions..."

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no ${SERVER_USER}@${SERVER_HOST} << 'ENDSSH'
            sudo chown -R corey:www-data /var/www/readingadventure.adhdlearn.com
            sudo find /var/www/readingadventure.adhdlearn.com -type d -exec chmod 755 {} \;
            sudo find /var/www/readingadventure.adhdlearn.com -type f -exec chmod 644 {} \;
            echo "✅ Permissions set: corey:www-data, dirs=755, files=644"
          ENDSSH

          echo "✅ Permissions configured"

      - name: Deployment complete
        run: |
          echo "╔════════════════════════════════════════════════╗"
          echo "║           Deployment Complete! ✅              ║"
          echo "╚════════════════════════════════════════════════╝"
          echo ""
          echo "🌐 Live at: https://readingadventure.adhdlearn.com"
          echo "🕒 Deployed at: $(date)"
