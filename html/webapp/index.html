<!DOCTYPE html>
<html>
<head>
    <title>Aurora's Reading Adventure</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a0033;  /* Deep purple background */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100vh;
            border: 2px solid #9b59b6;  /* Purple border */
            box-shadow: 0 0 20px rgba(155, 89, 182, 0.5);
        }
        #embed-html {
            outline: none;
        }
        #loading {
            color: #fff;
            text-align: center;
            position: absolute;
        }
        #loading h1 {
            color: #f1c40f;  /* Yellow text */
            margin-bottom: 10px;
        }
        #loading p {
            color: #ecf0f1;  /* Light gray text */
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>Aurora's Reading Adventure</h1>
        <p>Loading...</p>
    </div>
    <div id="embed-html"></div>
    <script type="text/javascript" src="html/html.nocache.js"></script>
</body>
</html>
